name: LumaDeck Artifact Previews

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/**/*.pptx'
      - '.github/workflows/render-previews.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumadeck-artifact-previews-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install render tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-impress poppler-utils

      - name: Render missing PPTX previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lumadeck-render
          changed=0
          while IFS= read -r -d '' pptx; do
            dir="$(dirname "$pptx")"
            preview_dir="$dir/previews"
            if [ -f "$preview_dir/slide-10.jpg" ]; then
              echo "Previews already exist: $pptx"
              continue
            fi
            rm -rf /tmp/lumadeck-render/*
            mkdir -p "$preview_dir"
            libreoffice --headless --convert-to pdf --outdir /tmp/lumadeck-render "$pptx"
            pdf="/tmp/lumadeck-render/$(basename "${pptx%.pptx}").pdf"
            test -s "$pdf"
            pdftoppm -jpeg -jpegopt quality=82 -r 96 "$pdf" /tmp/lumadeck-render/slide >/dev/null 2>&1
            n=1
            for src in /tmp/lumadeck-render/slide-*.jpg; do
              test -f "$src"
              printf -v dst '%s/slide-%02d.jpg' "$preview_dir" "$n"
              mv "$src" "$dst"
              n=$((n+1))
            done
            count=$((n-1))
            test "$count" -eq 10
            echo "Rendered $count previews for $pptx"
            changed=1
          done < <(find artifacts -type f -name '*.pptx' -print0)
          echo "changed=$changed" >> "$GITHUB_ENV"

      - name: Commit previews
        if: env.changed == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LumaDeck Worker'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/**/previews/*.jpg
          git commit -m 'Render LumaDeck artifact previews'
          git push origin HEAD:main
