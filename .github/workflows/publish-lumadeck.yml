name: LumaDeck Production Integrity

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'vercel.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical production source
        shell: python
        run: |
          from pathlib import Path
          import json
          html = Path('index.html').read_text(encoding='utf-8')
          cfg = json.loads(Path('vercel.json').read_text(encoding='utf-8'))
          assert len(html.encode('utf-8')) > 50000
          for marker in ['glassCanvas', "getContext('webgl2'", 'formatSwitch', 'LUMADECK_OUTPUT=', 'auth-session', 'viewerActions']:
              assert marker in html, marker
          rewrites = cfg.get('rewrites', [])
          dests = [str(x.get('destination','')) for x in rewrites]
          assert any('supabase.co/functions/v1/lumadeck-api' in x for x in dests)
          assert all('lumadeck-mobile-1tzn3q2yt-shahboz.vercel.app' not in x for x in dests)
          print('LumaDeck production integrity: PASS')
